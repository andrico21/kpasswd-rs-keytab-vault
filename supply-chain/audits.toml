[[audits.rasn]]
criteria = "safe-to-deploy"
delta = "0.28.14 -> 0.28.15"
notes = """
The 0.28.14 -> 0.28.15 delta was read on 2026-09-29: the DER/BER-visible
changes are the tagged-open-type constructed-bit fix (ber/enc.rs, X.690
section 8.14.3) and stricter OID arc validation (types/oid.rs); the rest is
the internal bit reader that replaces bitvec-nom2 and the PER rewrite
(bits.rs, per/*), which the der/ber path does not reach. No dependency is
added.
"""

