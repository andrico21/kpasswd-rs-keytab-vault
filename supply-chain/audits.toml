[[audits.pbkdf2]]
criteria = "safe-to-deploy"
version = "0.13.0-rc.10"
notes = """
Pre-release acceptance (FIX-12, KRP-55): pbkdf2 0.13.0-rc.10 is pinned by
rskrb5 0.2.0 and sits on the string-to-key path (AES-encrypted
PA-ENC-TIMESTAMP derivation). Accepted as a documented risk: the rc has no
known advisories and the API surface this crate exercises is the standard
PBKDF2 construction. Closing condition: an rskrb5 release that unpins to a
stable pbkdf2, at which point this audit entry is superseded by the
upstream version's audit.
"""

